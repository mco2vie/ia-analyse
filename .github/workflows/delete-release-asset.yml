name: Supprimer une pièce jointe de Release

on:
  push:
    branches: [main]
    paths:
      - ".github/delete-requests/*.txt"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag de la Release"
        required: true
        type: string
        default: "analyse-data"
      asset_name:
        description: "Nom exact du fichier à supprimer"
        required: true
        type: string
        default: "orbitals.log"
      confirmation:
        description: "Saisir exactement SUPPRIMER"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete-release-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt pour les demandes automatiques
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: actions/checkout@v4

      - name: Lire et valider la demande
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_ASSET: ${{ inputs.asset_name }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "schedule" ]]; then
            if [[ "$EVENT_NAME" == "push" ]]; then
              mapfile -t REQUEST_FILES < <(git diff-tree --no-commit-id --name-only -r "$COMMIT_SHA" | grep -E '^\.github/delete-requests/[^/]+\.txt$' || true)
            else
              mapfile -t REQUEST_FILES < <(find .github/delete-requests -maxdepth 1 -type f -name '*.txt' 2>/dev/null | sort | head -n 1)
            fi
            if [[ "${#REQUEST_FILES[@]}" -ne 1 ]]; then
              echo "Aucune demande unique à traiter."
              exit 0
            fi
            REQUEST_FILE="${REQUEST_FILES[0]}"
            TAG_NAME="$(sed -n 's/^tag=//p' "$REQUEST_FILE")"
            ASSET_NAME="$(sed -n 's/^asset=//p' "$REQUEST_FILE")"
            CONFIRMATION="$(sed -n 's/^confirmation=//p' "$REQUEST_FILE")"
            echo "request_file=$REQUEST_FILE" >> "$GITHUB_OUTPUT"
          else
            TAG_NAME="$INPUT_TAG"
            ASSET_NAME="$INPUT_ASSET"
            CONFIRMATION="$INPUT_CONFIRMATION"
            echo "request_file=" >> "$GITHUB_OUTPUT"
          fi

          [[ "$CONFIRMATION" == "SUPPRIMER" ]] || { echo "::error::Confirmation invalide."; exit 1; }
          [[ -n "$TAG_NAME" && -n "$ASSET_NAME" ]] || { echo "::error::Tag ou nom de fichier manquant."; exit 1; }
          [[ "$ASSET_NAME" != */* ]] || { echo "::error::Nom de fichier invalide."; exit 1; }
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Vérifier la présence exacte du fichier
        if: steps.request.outputs.asset != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.request.outputs.tag }}
          ASSET_NAME: ${{ steps.request.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if ! grep -Fqx -- "$ASSET_NAME" <<< "$ASSETS"; then
            echo "::error::Le fichier exact '$ASSET_NAME' est absent de la Release '$TAG_NAME'."
            exit 1
          fi

      - name: Supprimer la pièce jointe confirmée
        if: steps.request.outputs.asset != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.request.outputs.tag }}
          ASSET_NAME: ${{ steps.request.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete-asset "$TAG_NAME" "$ASSET_NAME" --repo "$GITHUB_REPOSITORY" --yes
          echo "Suppression terminée : '$ASSET_NAME' de la Release '$TAG_NAME'."

      - name: Consommer la demande automatique
        if: (github.event_name == 'push' || github.event_name == 'schedule') && steps.request.outputs.request_file != ''
        env:
          REQUEST_FILE: ${{ steps.request.outputs.request_file }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- "$REQUEST_FILE"
          git commit -m "Consommer la demande de suppression"
          git push
