name: Importer les fichiers de la Release pour analyse

on:
  # GitHub ne garantit pas qu'un ajout de fichier depuis l'interface Release
  # déclenche release.edited : on vérifie donc régulièrement les pièces jointes.
  schedule:
    - cron: "*/5 * * * *"
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag de la Release à récupérer"
        required: true
        default: "analyse-data"

permissions:
  contents: read
  actions: read

jobs:
  prepare-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Déterminer le tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            TAG="$EVENT_TAG"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="analyse-data"
          fi
          if [[ -z "$TAG" ]]; then
            echo "::error::Aucun tag de Release fourni."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Vérifier si de nouvelles pièces jointes existent
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME")"
          ASSET_COUNT="$(jq '.assets | length' <<< "$RELEASE_JSON")"
          if [[ "$ASSET_COUNT" -eq 0 ]]; then
            echo "Aucune pièce jointe dans la Release."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Date de la dernière exécution réussie de CE workflow, hors exécution actuelle.
          LAST_SUCCESS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/import-release-for-analysis.yml/runs?per_page=50" \
            --jq "[.workflow_runs[] | select((.id | tostring) != env.GITHUB_RUN_ID and .conclusion == \"success\")][0].created_at // \"1970-01-01T00:00:00Z\"")"

          NEW_COUNT="$(jq --arg last "$LAST_SUCCESS" '[.assets[] | select(.created_at > $last)] | length' <<< "$RELEASE_JSON")"
          echo "Dernière importation réussie : $LAST_SUCCESS"
          echo "Nouvelles pièces jointes : $NEW_COUNT"

          if [[ "$NEW_COUNT" -gt 0 ]]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "Aucun nouveau fichier : aucun artefact ne sera créé."
          fi

      - name: Télécharger les pièces jointes de la Release
        if: steps.check.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-assets"
          if ! find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "::error::La Release ne contient aucun fichier téléchargeable."
            exit 1
          fi
          echo "Fichiers récupérés :"
          find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f -printf '%f (%s octets)\\n'

      - name: Publier un artefact temporaire pour ChatGPT
        if: steps.check.outputs.has_new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 1
